      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  pattern-either:
    - patterns:
        - pattern-either:
            - pattern: "Buffer.from(`...${$TOKEN}`, ...)"
            - pattern: "Buffer.from(`...${$TOKEN}`)"
            - pattern: "btoa(`...${$TOKEN}`)"
        - pattern-regex: ":\\$\\{"
        - metavariable-regex:
            metavariable: $TOKEN
            regex: "(?i)(bot_?(token|password|pass)|service_?(token|password|account)|app_?password|appPassword)"

# ---------------------------------------------------------------------------------------------
# Resolver changes installation-wide state with no permission evidence
# A resolver can be invoked directly whatever modules display. WARNING: the reviewer confirms
# which modules can reach the resolver and whether a permission check lives in a helper.
# ---------------------------------------------------------------------------------------------
- id: forge-resolver-global-write-without-permission-check
  languages: [javascript, typescript]
  severity: WARNING
  message: >
    This resolver writes installation-wide state (a storage record with a fixed key, or an asApp()
    write to the product) and shows no permission check. Any user who can reach the app's frontend,
    or who invokes the resolver directly through the Forge GraphQL API, can trigger it; module
    placement and display conditions are not authorization. Check the caller's permission in the
    handler (for example /rest/api/3/mypermissions or a group lookup) before the write.
  metadata:
    skill_rule: "assets/security-rules/forge-authn-authz/missing-resolver-authz.mdc"
    cwe: ["CWE-862", "CWE-285"]
    confidence: MEDIUM
    security-severity: "7.5"
    forge_surface: "@forge/resolver + storage / asApp() writes"
    requires_manifest_correlation: true
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  patterns:
    - pattern: "resolver.define($N, $H)"
    - metavariable-pattern:
        metavariable: $H
        pattern-either:
          - pattern: |
              async (...) => { ... storage.set("...", ...); ... }
          - pattern: |
              async (...) => { ... storage.set('...', ...); ... }
          - pattern: |
              async (...) => { ... storage.delete("..."); ... }
          - pattern: |
              async (...) => { ... storage.delete('...'); ... }
          - pattern: |
              async (...) => { ... kvs.set("...", ...); ... }
          - pattern: |
              async (...) => { ... kvs.set('...', ...); ... }
          - pattern: |
              async (...) => { ... kvs.delete("..."); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: "POST", ... }); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: "PUT", ... }); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: "DELETE", ... }); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: "PATCH", ... }); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: 'POST', ... }); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: 'PUT', ... }); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: 'DELETE', ... }); ... }
          - pattern: |
              async (...) => { ... $API.asApp().$M($U, { ..., method: 'PATCH', ... }); ... }
    - pattern-not-regex: "(?i)(permission|authoriz|isAdmin|requireAdmin|adminOnly|onlyAdmin|withAdmin|ensureAdmin|assertAdmin|requireRole|hasRole|checkRole|guard\\.|withAuth|hasPermission|checkPermission|isSiteAdmin|mypermissions|/myself|context\\.accountId|accountId\\s*[!=]==?|license|groups|Forbidden|Unauthori|403|installContext|extension\\.(project|space|issue|content)\\b.*(admin|lead|owner))"
    - focus-metavariable: $N

# ---------------------------------------------------------------------------------------------
# Model output drives a privileged action
# A model reply is the condition for a storage write, an asApp() mutation, an invokeRemote call
# or a fetch with a method.
# ---------------------------------------------------------------------------------------------
- id: forge-llm-output-drives-privileged-action
  languages: [javascript, typescript]
  severity: WARNING
  message: >
    A value returned by a language-model call decides whether the app performs a privileged
    action (an asApp() write, a storage write or a remote call). The model reads content written
    by other users, so a prompt injection in an issue, page or pull request can trigger the action.
    Decide the action in code from structured data; treat the model's reply as untrusted text.
  metadata:
    skill_rule: "assets/security-rules/forge-rovo-agents/agent-privilege-escalation.mdc"
    cwe: ["CWE-807", "CWE-1426"]
    confidence: MEDIUM
    security-severity: "7.0"
    forge_surface: "Rovo / AI app actions"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  patterns:
    - pattern-either:
        - pattern-inside: |
            const $REPLY = await $FN(...);
            ...
        - pattern-inside: |
            const $REPLY = await $OBJ.$FN(...);
            ...
        - pattern-inside: |
            let $REPLY = await $FN(...);
            ...
        - pattern-inside: |
            let $REPLY = await $OBJ.$FN(...);
            ...
        - pattern-inside: |
            const $REPLY = $FN(...);
            ...
        - pattern-inside: |
            const $REPLY = $OBJ.$FN(...);
            ...
    - pattern-either:
        - pattern: "if (<... $REPLY ...>) { ... $API.asApp().$M(...); ... }"
        - pattern: "if (<... $REPLY ...>) { ... asApp().$M(...); ... }"
        - pattern: "if (<... $REPLY ...>) { ... storage.set(...); ... }"
        - pattern: "if (<... $REPLY ...>) { ... storage.delete(...); ... }"
        - pattern: "if (<... $REPLY ...>) { ... kvs.set(...); ... }"
        - pattern: "if (<... $REPLY ...>) { ... invokeRemote(...); ... }"
        - pattern: "if (<... $REPLY ...>) { ... $API.fetch($U, { ..., method: $MM, ... }); ... }"
        - pattern: "if (<... $REPLY ...>) { ... fetch($U, { ..., method: $MM, ... }); ... }"
    - metavariable-regex:
        metavariable: $FN
        regex: "(?i)(llm|openai|anthropic|bedrock|gemini|rovo|chat|completion|prompt|ask_?ai|askllm|generate|invokeModel|converse|claude|gpt|assistant)"

# ---------------------------------------------------------------------------------------------
# Manifest rules: wildcard and tunnel egress
# Regex-based so they work on both a YAML manifest and a single-line JSON manifest. Style
# unsafe-inline, manage:* scopes and *.atlassian.net style wildcards are common and are not
# reported.
#
# A '*' entry under fetch.backend, fetch.client or scripts removes the app's only control over
# where it sends data and loads code.
# ---------------------------------------------------------------------------------------------
- id: forge-manifest-wildcard-egress
  languages: [generic]
  severity: ERROR
  message: >
    The manifest allows backend or client fetch (or script loading) from any host ("*"). The
    egress allowlist is the app's only control over where it can send data and load code; a
    wildcard removes it and turns any URL-handling bug into unrestricted SSRF or data exfiltration.
    List the exact hosts the app needs.
  metadata:
    skill_rule: "assets/security-rules/forge-egress-remotes/wildcard-permissions.mdc"
    cwe: ["CWE-918", "CWE-284"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "manifest permissions.external.fetch / scripts"
  paths:
    include:
      - "**/manifest.yml"
      - "**/manifest.yaml"
  pattern-either:
    - pattern-regex: "\"(backend|client|scripts)\"\\s*:\\s*\\[[^\\]]*\"\\*\"[^\\]]*\\]"
    - pattern-regex: "\"(backend|client|scripts)\"\\s*:\\s*\\[[^\\]]*\"address\"\\s*:\\s*\"\\*\""
    - pattern-regex: "(?ms)^\\s*(backend|client|scripts):\\s*\\n(?:\\s*-\\s[^\\n]*\\n)*?\\s*-\\s*(?:address:\\s*)?['\"]?\\*['\"]?\\s*$"

# ---------------------------------------------------------------------------------------------
# Developer tunnel host allowed for egress
# ngrok, localtunnel, Cloudflare quick tunnels and similar hosts belong to a development session.
# ---------------------------------------------------------------------------------------------
- id: forge-manifest-dev-tunnel-egress
  languages: [generic]
  severity: ERROR
  message: >
    The manifest allows egress to a development tunnel service (ngrok, localtunnel, Cloudflare
    quick tunnels or similar). Tunnel hostnames are reassigned to other users, so production
    traffic can reach an attacker-controlled endpoint; a tunnel entry in a published manifest is
    almost always a leftover from local testing. Remove it before release.
  metadata:
    skill_rule: "assets/security-rules/forge-manifest-config/egress-url-entries.mdc"
    cwe: ["CWE-918", "CWE-668"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "manifest permissions.external"
  paths:
    include:
      - "**/manifest.yml"
      - "**/manifest.yaml"
  pattern-regex: "(?i)(ngrok(-free)?\\.(io|app|dev)|localtunnel\\.me|loca\\.lt|trycloudflare\\.com|serveo\\.net|localhost\\.run|tunnelmole\\.(com|net)|localtonet\\.com|pinggy\\.io)"

# ---------------------------------------------------------------------------------------------
# Wildcard over a shared hosting or CDN domain
# A wildcard such as *.cloudfront.net admits every tenant of that provider. Atlassian platform and
# analytics vendor domains are not reported.
# ---------------------------------------------------------------------------------------------
- id: forge-manifest-shared-hosting-wildcard-egress
  languages: [generic]
  severity: WARNING
  message: >
    The manifest allows egress to every subdomain of a shared-hosting or object-storage service
    (for example *.cloudfront.net, *.amazonaws.com, *.googleapis.com, *.github.io). Anyone can
    create a hostname under these domains, so the allowlist no longer limits where the app can send
    data or load code from. Replace the wildcard with the exact hostnames the app uses.
  metadata:
    skill_rule: "assets/security-rules/forge-egress-remotes/wildcard-permissions.mdc"
    cwe: ["CWE-918"]
    confidence: MEDIUM
    security-severity: "6.0"
    forge_surface: "manifest permissions.external"
  paths:
    include:
      - "**/manifest.yml"
      - "**/manifest.yaml"
  pattern-regex: "(?i)\\*\\.(cloudfront\\.net|amazonaws\\.com|s3\\.[a-z0-9.-]*amazonaws\\.com|googleapis\\.com|storage\\.googleapis\\.com|appspot\\.com|web\\.app|firebaseapp\\.com|github\\.io|githubusercontent\\.com|herokuapp\\.com|azurewebsites\\.net|blob\\.core\\.windows\\.net|vercel\\.app|netlify\\.app|pages\\.dev|workers\\.dev|onrender\\.com|fly\\.dev|glitch\\.me|repl\\.co|wp\\.com|wordpress\\.com|blogspot\\.com|surge\\.sh|digitaloceanspaces\\.com|backblazeb2\\.com|r2\\.dev)"

# ---------------------------------------------------------------------------------------------
# Script CSP relaxed with unsafe-eval or unsafe-inline
# Reports unsafe-eval and unsafe-inline under permissions.content.scripts only. Style
# unsafe-inline, wasm-unsafe-eval and external script host lists are not reported. Use the
# result to decide how closely to review Custom UI HTML sinks.
# ---------------------------------------------------------------------------------------------
- id: forge-manifest-csp-unsafe-script-directive
  languages: [generic]
  severity: WARNING
  message: >
    The manifest relaxes the Custom UI script policy with unsafe-eval or unsafe-inline for
    scripts. unsafe-eval lets any injected string run as code, and unsafe-inline for scripts
    disables the main defence against XSS inside the app iframe. Confirm the build genuinely
    needs it; prefer bundled scripts, and hashes or nonces for unavoidable inline code. Check the
    Custom UI code for HTML sinks fed by user or product data. (unsafe-inline for styles is
    common and is not reported.)
  metadata:
    skill_rule: "assets/security-rules/forge-manifest-config/content-security-policy.mdc"
    cwe: ["CWE-79", "CWE-1021"]
    confidence: MEDIUM
    security-severity: "5.5"
    forge_surface: "manifest permissions.content.scripts"
  paths:
    include:
      - "**/manifest.yml"
      - "**/manifest.yaml"
  pattern-either:
    - pattern-regex: "\"scripts\"\\s*:\\s*\\[[^\\]]*\"'?unsafe-(eval|inline)'?\""
    - pattern-regex: "(?ms)^\\s*scripts:\\s*\\n(?:\\s*-\\s[^\\n]*\\n)*?\\s*-\\s*['\"]?unsafe-(eval|inline)['\"]?\\s*(?:#[^\\n]*)?$"
    - pattern-regex: "(?m)^\\s*scripts:\\s*\\[(?:[^\\]\\n]*,)?\\s*['\"]?unsafe-(eval|inline)['\"]?\\s*[,\\]]"
