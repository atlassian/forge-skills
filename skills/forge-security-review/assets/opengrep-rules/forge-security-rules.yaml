# Forge security rules for OpenGrep
#
# Deterministic checks for Atlassian Forge apps. Taint rules follow request data into asApp()
# routes, fetch and invokeRemote URLs, JQL/CQL, Forge SQL, storage keys, request headers and HTML
# sinks. Further rules cover web trigger authentication, module-scope request state, sandbox
# escapes, secrets returned to the client or kept in plain storage, Basic auth with API tokens,
# client-chosen authorization targets, prototype pollution through payload merges, the private
# cross-tenant API, installation-wide writes without a permission check, model output driving
# privileged actions, and manifest settings (anonymous access, wildcard and tunnel egress,
# unsafe script CSP directives).
#
# Conventions used by every rule in this file:
#   * fire on the defect itself, not on a name or an inventory signal
#   * taint sources are identifiers (payload, req.payload, event.body ...), never a whole
#     destructuring pattern, so `context` / `installContext` are not tainted by accident
#   * sinks focus on the dangerous argument (focus-metavariable) so request bodies and
#     options objects do not trigger URL rules
#   * path excludes are spelled out per extension (OpenGrep 1.16.2 does not expand `{js,ts}`
#     brace globs)
#   * manifest rules are regex-based so they work on a YAML manifest and on a single-line JSON one
#   * severity reflects what the rule can prove: ERROR means the matched code is the defect;
#     WARNING means the message says what the reviewer must still confirm
#
# metadata.skill_rule names the rule file under assets/security-rules/ that the agent applies
# to each hit before reporting it. metadata.security-severity is a CVSS-style ordering hint,
# not the reported score; the agent still scores every confirmed finding with CVSS v3.1.
#
# The rules use Semgrep rule syntax and run on OpenGrep, an open-source Semgrep-compatible
# engine. No Semgrep registry rules or account are involved.
#
# Run with scripts/run_static_analysis.sh (pinned OpenGrep, JSON + SARIF output). Validate
# with: opengrep --validate --config assets/opengrep-rules
# Fixtures and expected results live in evals/.

rules:

# ---------------------------------------------------------------------------------------------
# asApp() request path carries user-controlled data (IDOR / privilege misuse)
# Taint: resolver payload, web trigger request fields and event bodies reaching the URL of an
# asApp() product request, including JQL/CQL in the query string. Paging and shaping parameters
# (maxResults, startAt, fields ...) are treated as sanitised: they cannot select another object.
# ---------------------------------------------------------------------------------------------
- id: forge-asapp-user-input-in-path
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    User-controlled data reaches the URL of an asApp() product request. asApp() runs with the
    app's own scopes and skips the caller's permissions, so a caller can read or modify objects
    they cannot access themselves (IDOR), including through JQL/CQL in the query string. Use
    asUser() for caller-driven requests, or verify the caller's permission on the referenced
    object (for example /rest/api/3/permissions/check) before calling asApp().
  metadata:
    skill_rule: "assets/security-rules/forge-authn-authz/asapp-privilege-escalation.mdc"
    cwe: ["CWE-639", "CWE-863"]
    confidence: HIGH
    security-severity: "8.5"
    forge_surface: "@forge/api asApp()"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.test.mjs"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
  mode: taint
  pattern-sources:
    - patterns:
        - pattern: payload
        - pattern-not-inside: |
            const payload = $V;
            ...
        - pattern-not-inside: |
            let payload = $V;
            ...
    - patterns:
        - pattern: $REQ.payload
        - metavariable-regex:
            metavariable: $REQ
            regex: "^(req|request|args|input)$"
    - patterns:
        - pattern-either:
            - pattern-inside: "resolver.define($N, ({ payload: $P, ... }) => { ... })"
            - pattern-inside: "resolver.define($N, async ({ payload: $P, ... }) => { ... })"
        - pattern: $P
    - patterns:
        - pattern-either:
            - pattern: $EVENT.body
            - pattern: $EVENT.queryParameters
            - pattern: $EVENT.headers
            - pattern: $EVENT.path
        - metavariable-regex:
            metavariable: $EVENT
            regex: "^(event|evt|e|req|request|webtriggerEvent)$"
  pattern-sanitizers:
    # paging / shaping parameters are not object identifiers; they cannot select another
    # principal's object
    - patterns:
        - pattern: $V
        - metavariable-regex:
            metavariable: $V
            regex: "(?i)(^|\\.)(maxResults|startAt|start|limit|offset|pageSize|cursor|orderBy|expand|fields|page|pageToken|nextPageToken)$"
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: api.asApp().requestJira($URL, ...)
            - pattern: api.asApp().requestConfluence($URL, ...)
            - pattern: api.asApp().requestBitbucket($URL, ...)
            - pattern: api.asApp().requestCompass($URL, ...)
            - pattern: api.asApp().requestGraph($URL, ...)
            - pattern: api.asApp().fetch($URL, ...)
            - pattern: $API.asApp().requestJira($URL, ...)
            - pattern: $API.asApp().requestConfluence($URL, ...)
            - pattern: $API.asApp().requestBitbucket($URL, ...)
            - pattern: $API.asApp().requestCompass($URL, ...)
            - pattern: $API.asApp().requestGraph($URL, ...)
            - pattern: $API.asApp().fetch($URL, ...)
        - focus-metavariable: $URL

# ---------------------------------------------------------------------------------------------
# @forge/api fetch() with a user-controlled URL (SSRF inside the egress allowlist)
# Taint on the URL argument only. encodeURIComponent and lookups in a constant table count as
# sanitisers.
# ---------------------------------------------------------------------------------------------
- id: forge-api-fetch-tainted-url
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    User-controlled data reaches the URL of a @forge/api fetch(). The manifest egress list
    bounds the hosts, but a caller can still pick any path on an allowed host or reach a
    wildcard egress target (SSRF). Build the URL from constants, map user input through an
    allowlist, and pass user values only as validated query parameters.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/ssrf.mdc"
    cwe: ["CWE-918"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "@forge/api fetch"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
  mode: taint
  pattern-sources:
    - patterns:
        - pattern: payload
        - pattern-not-inside: |
            const payload = $V;
            ...
        - pattern-not-inside: |
            let payload = $V;
            ...
    - patterns:
        - pattern: $REQ.payload
        - metavariable-regex:
            metavariable: $REQ
            regex: "^(req|request|args|input)$"
    - patterns:
        - pattern-either:
            - pattern-inside: "resolver.define($N, ({ payload: $P, ... }) => { ... })"
            - pattern-inside: "resolver.define($N, async ({ payload: $P, ... }) => { ... })"
        - pattern: $P
    - patterns:
        - pattern-either:
            - pattern: $EVENT.body
            - pattern: $EVENT.queryParameters
            - pattern: $EVENT.headers
        - metavariable-regex:
            metavariable: $EVENT
            regex: "^(event|evt|e|req|request|webtriggerEvent)$"
  pattern-sanitizers:
    # an encoded value cannot change host or path segments
    - pattern: encodeURIComponent(...)
    - pattern: Number(...)
    # lookup in an upper-case constant table is an allowlist
    - patterns:
        - pattern: $TABLE[$K]
        - metavariable-regex:
            metavariable: $TABLE
            regex: "^[A-Z][A-Z0-9_]*$"
    - patterns:
        - pattern: $TABLE.get($K)
        - metavariable-regex:
            metavariable: $TABLE
            regex: "^[A-Z][A-Z0-9_]*$"
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: api.fetch($URL, ...)
            - pattern: api.asApp().fetch($URL, ...)
            - pattern: api.asUser().fetch($URL, ...)
            - pattern: $API.asApp().fetch($URL, ...)
            - pattern: $API.asUser().fetch($URL, ...)
        - focus-metavariable: $URL

# ---------------------------------------------------------------------------------------------
# Web trigger handler processes the request without any authentication evidence
# Matches exported handlers that read request fields and contain no authentication code (HMAC,
# signature, JWT verification, shared secret, API key header, authorize/authenticate helper).
# The rule cannot tell web triggers from other event consumers: correlate each hit with the
# manifest webtrigger modules.
# ---------------------------------------------------------------------------------------------
- id: forge-webtrigger-missing-auth
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    Exported handler reads the incoming web trigger request (body, headers, query) and shows
    no authentication step. Web trigger URLs are reachable by anyone who learns them. Verify a
    signature (HMAC with crypto.timingSafeEqual), a JWT, or a shared secret from
    storage.getSecret() before acting on the request, and return 401 on failure. Confirm the
    function is declared under a webtrigger module in manifest.yml before reporting.
  metadata:
    skill_rule: "assets/security-rules/forge-webtrigger-entrypoints/webtrigger-security.mdc"
    cwe: ["CWE-306", "CWE-862"]
    confidence: MEDIUM
    security-severity: "8.0"
    forge_surface: "webtrigger module"
    requires_manifest_correlation: true
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.test.mjs"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/*.config.js"
      - "**/*.config.ts"
      - "**/*.config.mjs"
  patterns:
    - pattern-either:
        - pattern: export const $H = async ($EVENT, ...) => { $...BODY }
        - pattern: export const $H = ($EVENT, ...) => { $...BODY }
        - pattern: export async function $H($EVENT, ...) { $...BODY }
        - pattern: export function $H($EVENT, ...) { $...BODY }
        - pattern: exports.$H = async ($EVENT, ...) => { $...BODY }
        - pattern: exports.$H = ($EVENT, ...) => { $...BODY }
        - pattern: module.exports.$H = async ($EVENT, ...) => { $...BODY }
        - pattern: module.exports.$H = ($EVENT, ...) => { $...BODY }
    - metavariable-regex:
        metavariable: $EVENT
        regex: "^(event|evt|ev|e|req|request|webtriggerEvent|webTriggerEvent|trigger|input)$"
    - metavariable-pattern:
        metavariable: $...BODY
        pattern-either:
          - pattern: $EVENT.body
          - pattern: $EVENT.headers
          - pattern: $EVENT.queryParameters
          - pattern: $EVENT.path
          - pattern: "const { ..., body, ... } = $EVENT"
          - pattern: "const { ..., headers, ... } = $EVENT"
          - pattern: "const { ..., queryParameters, ... } = $EVENT"
          - pattern: "JSON.parse($EVENT.body)"
    # authentication evidence must look like code (a call, or a read of an inbound auth header),
    # so comments such as "no authentication check" do not suppress the finding
    - pattern-not-regex: "(?i)\\b(verify\\w*|validate\\w*(token|secret|signature|auth|hmac|request|webhook)\\w*|authenticate\\w*|authoriz\\w*|requireauth\\w*|checkauth\\w*|isauthorized|isauthenticated|ensureauth\\w*|assertauth\\w*|timingsafeequal|createhmac|jwtverify|comparesync|check(signature|secret|token|apikey))\\s*\\(|getsecret\\s*\\(|headers\\s*\\[\\s*['\"](x-[\\w-]*(key|token|secret|sig\\w*|auth\\w*)[\\w-]*|authorization)['\"]\\s*\\]|headers\\.(authorization|x[A-Z]\\w*(Key|Token|Secret|Signature))"
    - focus-metavariable: $H

# ---------------------------------------------------------------------------------------------
# postMessage with a wildcard target origin from Custom UI
# Similar to the upstream opengrep-rules wildcard-postmessage-configuration rule; included so
# this file is self-contained.
# ---------------------------------------------------------------------------------------------
- id: forge-bridge-postmessage-wildcard-origin
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    postMessage() is sent with target origin '*'. In a Forge Custom UI iframe any other frame
    can receive the message, including tokens or context obtained through @forge/bridge. Pass
    the exact product origin as the target.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/xss.mdc"
    cwe: ["CWE-346"]
    confidence: HIGH
    security-severity: "7.0"
    forge_surface: "Custom UI / @forge/bridge"
    upstream_overlap: "opengrep-rules javascript.browser.security.wildcard-postmessage-configuration"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.jsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
  pattern-either:
    - pattern: $W.postMessage($MSG, "*")
    - pattern: $W.postMessage($MSG, '*')
    - pattern: postMessage($MSG, "*")
    - pattern: postMessage($MSG, '*')
    - pattern: $W.postMessage($MSG, "*", ...)
    - pattern: $W.postMessage($MSG, '*', ...)

# ---------------------------------------------------------------------------------------------
# Module-scope state receives request or tenant data inside a handler
# Fires only when a module-scope variable is assigned, pushed or set from payload / context /
# event / storage / product API data inside a function body. Forge reuses warm function
# instances, so a later invocation (possibly for another tenant) can read the value.
# ---------------------------------------------------------------------------------------------
- id: forge-module-state-holds-request-data
  languages: [javascript, typescript]
  severity: WARNING
  message: >
    A module-scope variable is written with request, tenant or storage data inside a handler.
    Forge reuses warm function instances across invocations and across tenants, so this value
    is visible to the next caller, possibly from another site. Keep per-request data inside the
    handler, or key the cache by context.cloudId / installContext and bound its lifetime.
  metadata:
    skill_rule: "assets/security-rules/forge-tenant-isolation/global-state-warmstart.mdc"
    cwe: ["CWE-668", "CWE-362"]
    confidence: MEDIUM
    security-severity: "7.0"
    forge_surface: "Forge runtime (warm instance reuse)"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/**"
      - "**/frontend/**"
      - "**/ui/**"
      - "**/webui/**"
      - "**/public/**"
      - "**/scripts/**"
      - "**/tools/**"
      - "**/bin/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.jsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/*.config.js"
      - "**/*.config.ts"
      - "**/*.config.mjs"
  mode: taint
  pattern-sources:
    - pattern: payload
    - pattern: $R.payload
    - pattern: context
    - pattern: $R.context
    - pattern: event
    - pattern: storage.get(...)
    - pattern: storage.getSecret(...)
    - pattern: kvs.get(...)
    - pattern: kvs.getSecret(...)
    - pattern: $API.asApp().$M(...)
    - pattern: $API.asUser().$M(...)
    - pattern: $RESP.json()
    - pattern: $RESP.text()
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern-inside: |
                let $X = $INIT;
                ...
            - pattern-inside: |
                var $X = $INIT;
                ...
            - pattern-inside: |
                const $X = $INIT;
                ...
            - pattern-inside: |
                let $X;
                ...
            - pattern-inside: |
                export let $X = $INIT;
                ...
            - pattern-inside: |
                export let $X;
                ...
        - pattern-either:
            - pattern-inside: function $F(...) { ... }
            - pattern-inside: async function $F(...) { ... }
            - pattern-inside: (...) => { ... }
            - pattern-inside: async (...) => { ... }
            - pattern-inside: function (...) { ... }
            - pattern-inside: async function (...) { ... }
        - pattern-either:
            - pattern: $X = $V
            - pattern: $X.$P = $V
            - pattern: $X[$K] = $V
            - pattern: $X.$P[$K] = $V
            - pattern: $X.set($K, $V)
            - pattern: $X.$P.set($K, $V)
            - pattern: $X.push($V)
            - pattern: $X.$P.push($V)
            - pattern: $X.add($V)
            - pattern: Object.assign($X, $V)
        - pattern-not: const $X = $V
        - pattern-not: $X += $V
        - pattern-not: $X -= $V
        - pattern-not: $X++
        - pattern-not: $X--
        - pattern-not: let $X = $V
        - pattern-not: var $X = $V
        - pattern-not: export const $X = $V
        - pattern-not: export let $X = $V
        - pattern-not: $X = (...) => $B
        - pattern-not: $X = async (...) => $B
        - pattern-not: $X = (...) => { ... }
        - pattern-not: $X = async (...) => { ... }
        - pattern-not: $X = function(...) { ... }
        - pattern-not: $X = async function(...) { ... }
        - pattern-not-inside: function $F(...) { ... let $X = $INIT; ... }
        - pattern-not-inside: function $F(...) { ... const $X = $INIT; ... }
        - pattern-not-inside: function $F(...) { ... var $X = $INIT; ... }
        - pattern-not-inside: function $F(...) { ... let $X; ... }
        - pattern-not-inside: function $F(...) { ... var $X; ... }
        - pattern-not-inside: (...) => { ... let $X = $INIT; ... }
        - pattern-not-inside: (...) => { ... const $X = $INIT; ... }
        - pattern-not-inside: (...) => { ... var $X = $INIT; ... }
        - pattern-not-inside: (...) => { ... let $X; ... }
        - pattern-not-inside: (...) => { ... var $X; ... }
        - pattern-not-inside: $M(...) { ... let $X = $INIT; ... }
        - pattern-not-inside: $M(...) { ... const $X = $INIT; ... }
        - pattern-not-inside: $M(...) { ... let $X; ... }
        - pattern-not-inside: $M(...) { ... var $X; ... }
        - pattern-not-inside: |
            for (let $X = $I; ...; ...) { ... }
        - pattern-not-inside: |
            for (const $X of $ITER) { ... }
        - pattern-not-inside: |
            for (let $X of $ITER) { ... }
        - pattern-not-inside: |
            for (const $X in $OBJ) { ... }
        - focus-metavariable: $V

# ---------------------------------------------------------------------------------------------
# process.env / global mutation at runtime
# Browser bundles, polyfills and instrumentation idioms (for example assigning global.fetch)
# are excluded.
# ---------------------------------------------------------------------------------------------
- id: forge-process-env-mutation
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    process.env or a global is mutated at runtime. In Forge both are shared by every
    invocation on a warm instance, across tenants, so values written here leak to other
    callers and other sites. Pass the value explicitly instead of through the environment.
  metadata:
    skill_rule: "assets/security-rules/forge-tenant-isolation/global-state-warmstart.mdc"
    cwe: ["CWE-668"]
    confidence: MEDIUM
    security-severity: "7.0"
    forge_surface: "Forge runtime (warm instance reuse)"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/scripts/**"
      - "**/tools/**"
      - "**/bin/**"
      - "**/static/**"
      - "**/_next/**"
      - "**/frontend/**"
      - "**/ui/**"
      - "**/public/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/*.config.js"
      - "**/*.config.ts"
      - "**/*.config.mjs"
  patterns:
    - pattern-either:
        - pattern: process.env.$X = $Y
        - pattern: process.env[$K] = $Y
        - pattern: global.$X = $Y
        - pattern: globalThis.$X = $Y
    - pattern-not: global.fetch = $Y
    - pattern-not: globalThis.fetch = $Y
    - pattern-not: process.env.NODE_ENV = $Y
    # polyfill / instrumentation idioms are not tenant data
    - pattern-not: global.$X = require(...)
    - pattern-not: global.$X = global.$X || $D
    - pattern-not: global.window = $Y
    - pattern-not: global.document = $Y
    - pattern-not: global.navigator = $Y
    - pattern-not: global.self = $Y
    - pattern-not: global.$X = function(...) { ... }
    - pattern-not: global.$X = (...) => { ... }
    - pattern-not: globalThis.$X = globalThis.$X || $D

# ---------------------------------------------------------------------------------------------
# Storage key is exactly a user-controlled value (read or write any key)
# The key expression is the tainted value itself, with no constant prefix, so the caller can
# address every record of the installation.
# ---------------------------------------------------------------------------------------------
- id: forge-storage-key-user-controlled
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    The storage key is taken directly from request data. The caller can read, overwrite or
    delete any record in this installation's store, including records that belong to other
    users. Unless this resolver is reachable only by site admins, derive keys from a constant
    prefix plus an identifier you have authorised, and bind user-specific records to
    context.accountId.
  metadata:
    skill_rule: "assets/security-rules/forge-authn-authz/missing-resolver-authz.mdc"
    cwe: ["CWE-639", "CWE-284"]
    confidence: MEDIUM
    security-severity: "8.5"
    forge_surface: "@forge/api storage / @forge/kvs"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
  patterns:
    - pattern-either:
        - pattern: storage.$M($KEY, ...)
        - pattern: kvs.$M($KEY, ...)
        - pattern: storage.entity($E).$M($KEY, ...)
        - pattern: kvs.entity($E).$M($KEY, ...)
    - metavariable-regex:
        metavariable: $M
        regex: "^(get|getSecret|set|setSecret|delete|deleteSecret)$"
    - pattern-either:
        # the key expression is itself a request field
        - pattern: storage.$M(payload, ...)
        - pattern: storage.$M(payload.$F, ...)
        - pattern: storage.$M(payload.$F.$G, ...)
        - pattern: storage.$M($R.payload, ...)
        - pattern: storage.$M($R.payload.$F, ...)
        - pattern: storage.$M($R.payload.$F.$G, ...)
        - pattern: kvs.$M(payload, ...)
        - pattern: kvs.$M(payload.$F, ...)
        - pattern: kvs.$M(payload.$F.$G, ...)
        - pattern: kvs.$M($R.payload, ...)
        - pattern: kvs.$M($R.payload.$F, ...)
        - pattern: kvs.$M($R.payload.$F.$G, ...)
        - pattern: storage.entity($E).$M(payload, ...)
        - pattern: storage.entity($E).$M(payload.$F, ...)
        - pattern: storage.entity($E).$M(payload.$F.$G, ...)
        - pattern: storage.entity($E).$M($R.payload, ...)
        - pattern: storage.entity($E).$M($R.payload.$F, ...)
        - pattern: storage.entity($E).$M($R.payload.$F.$G, ...)
        - pattern: kvs.entity($E).$M(payload, ...)
        - pattern: kvs.entity($E).$M(payload.$F, ...)
        - pattern: kvs.entity($E).$M(payload.$F.$G, ...)
        - pattern: kvs.entity($E).$M($R.payload, ...)
        - pattern: kvs.entity($E).$M($R.payload.$F, ...)
        - pattern: kvs.entity($E).$M($R.payload.$F.$G, ...)
        # the key is a direct alias of a request field
        - pattern-inside: |
            const $KEY = payload.$F;
            ...
        - pattern-inside: |
            const $KEY = $R.payload.$F;
            ...
        - pattern-inside: |
            const { $KEY, ... } = payload;
            ...
        - pattern-inside: |
            const { $KEY, ... } = $R.payload;
            ...
        # the key is a field of an object that is the request payload (or a payload field)
        - patterns:
            - pattern-either:
                - pattern: storage.$M($D.$F, ...)
                - pattern: kvs.$M($D.$F, ...)
                - pattern: storage.entity($E).$M($D.$F, ...)
                - pattern: kvs.entity($E).$M($D.$F, ...)
            - pattern-either:
                - pattern-inside: |
                    const $D = $R.payload;
                    ...
                - pattern-inside: |
                    const $D = payload.$G;
                    ...
                - pattern-inside: |
                    const $D = $R.payload.$G;
                    ...
                - pattern-inside: |
                    const $D = $R.payload as $T;
                    ...
