# ---------------------------------------------------------------------------------------------
# Context identifier with a payload fallback (authorization target chosen by the client)
# Shape: context.extension.repository.uuid ?? payload.uuid. When the context field is absent,
# or the resolver is invoked directly, the caller chooses the object the handler acts on.
# ---------------------------------------------------------------------------------------------
- id: forge-context-identifier-payload-fallback
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    A platform-provided identifier from the invocation context falls back to a value supplied by
    the client. When the context field is absent (or the caller invokes the resolver directly) the
    caller chooses the object the handler acts on, which bypasses the module placement the app
    relies on for authorization. Use the context value only, and fail closed when it is missing.
  metadata:
    skill_rule: "assets/security-rules/forge-authn-authz/prefer-context-authz.mdc"
    cwe: ["CWE-639", "CWE-807"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "@forge/resolver context vs payload"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  patterns:
    - pattern-either:
        - pattern: "$CTX.extension?.$A ?? payload.$F"
        - pattern: "$CTX.extension?.$A?.$B ?? payload.$F"
        - pattern: "$CTX.extension?.$A?.$B?.$C ?? payload.$F"
        - pattern: "$CTX.extension?.$A || payload.$F"
        - pattern: "$CTX.extension?.$A?.$B || payload.$F"
        - pattern: "$CTX.extension.$A?.$B ?? payload.$F"
        - pattern: "$R.context.extension?.$A?.$B ?? $R.payload.$F"
        - pattern: "$R.context?.extension?.$A?.$B ?? $R.payload.$F"
        - pattern: "$CTX.extension.$A ?? payload.$F"
        - pattern: "$CTX.extension.$A.$B ?? payload.$F"
        - pattern: "$CTX.extension.$A.$B.$C ?? payload.$F"
        - pattern: "$CTX.extension.$A || payload.$F"
        - pattern: "$CTX.extension.$A.$B || payload.$F"
        - pattern: "$CTX.extension.$A.$B.$C || payload.$F"
        - pattern: "payload.$F ?? $CTX.extension.$A"
        - pattern: "payload.$F ?? $CTX.extension.$A.$B"
        - pattern: "payload.$F || $CTX.extension.$A"
        - pattern: "payload.$F || $CTX.extension.$A.$B"
        - pattern: "$CTX.accountId ?? payload.$F"
        - pattern: "$CTX.accountId || payload.$F"
        - pattern: "$CTX.cloudId ?? payload.$F"
        - pattern: "$CTX.cloudId || payload.$F"
        - pattern: "$CTX.extension.$A ? $CTX.extension.$A : payload.$F"
        - pattern: "$CTX.extension.$A.$B ? $CTX.extension.$A.$B : payload.$F"
        - pattern: "$R.context.extension.$A ?? $R.payload.$F"
        - pattern: "$R.context.extension.$A.$B ?? $R.payload.$F"
        - pattern: "$R.context.extension.$A || $R.payload.$F"
        - pattern: "$R.context.extension.$A.$B || $R.payload.$F"
        - pattern: "$R.context.accountId ?? $R.payload.$F"
        - pattern: "$R.context.accountId || $R.payload.$F"
    - metavariable-regex:
        metavariable: $CTX
        regex: "^(context|ctx|.*\\.context)$"

# ---------------------------------------------------------------------------------------------
# Client-supplied identity or role field used in an authorization decision
# Shapes: if (payload.isAdmin), if (payload.role === 'admin').
# ---------------------------------------------------------------------------------------------
- id: forge-payload-identity-trusted
  languages: [javascript, typescript]
  severity: WARNING
  message: >
    An authorization decision branches on an identity or role field that the client sends in the
    resolver payload. Anyone can invoke the resolver with that field set. Derive identity from
    context.accountId and check roles through the product API (groups, permissions) on the server.
  metadata:
    skill_rule: "assets/security-rules/forge-authn-authz/prefer-context-authz.mdc"
    cwe: ["CWE-807", "CWE-863"]
    confidence: MEDIUM
    security-severity: "7.0"
    forge_surface: "@forge/resolver payload"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  patterns:
    - pattern-either:
        - pattern-inside: "resolver.define($N, $H)"
        - pattern-inside: "export const $H = async ({ payload, ... }) => { ... }"
        - pattern-inside: "export async function $H({ payload, ... }) { ... }"
        - pattern-inside: "export const $H = async ($R) => { ... }"
        - pattern-inside: "export async function $H($R) { ... }"
    - pattern-not-inside: "$JWT.verify(...)"
    - pattern-not-inside: |
        const payload = $JWT.verify(...);
        ...
    - pattern-not-inside: |
        const payload = jwtVerify(...);
        ...
    - pattern-not-inside: |
        const { payload } = await jwtVerify(...);
        ...
    - pattern-either:
        - pattern: "if (<... payload.$F ...>) { ... }"
        - pattern: "if (<... $R.payload.$F ...>) { ... }"
        - pattern: "<... payload.$F ...> ? $A : $B"
        - pattern: "<... $R.payload.$F ...> ? $A : $B"
    - metavariable-regex:
        metavariable: $F
        regex: "(?i)^(isAdmin|isSiteAdmin|isProjectAdmin|admin|isOwner|owner|role|roles|userRole|permissions?|hasPermission|canEdit|canDelete|isAuthorized|authorized|accountId|userId|currentUser|cloudId|siteId)$"

# ---------------------------------------------------------------------------------------------
# JQL / CQL sent in a request body through asApp()
# The URL-focused asApp rule cannot see POST bodies; the current Jira search API takes JQL in a
# JSON body (/rest/api/3/search/jql).
# ---------------------------------------------------------------------------------------------
- id: forge-asapp-query-in-request-body
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    Request data reaches the body of an asApp() search request (JQL, CQL or a search payload).
    asApp() searches run with the app's scopes, so a caller-controlled query returns issues or
    pages the caller cannot see. Use asUser() for caller-driven searches, or build the query from
    validated constants and pass user values only as quoted, allow-listed terms.
  metadata:
    skill_rule: "assets/security-rules/forge-authn-authz/asapp-privilege-escalation.mdc"
    cwe: ["CWE-943", "CWE-639"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "@forge/api asApp() search body"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  mode: taint
  pattern-sources:
    - patterns:
        - pattern: "payload"
        - pattern-not-inside: |
            const payload = $V;
            ...
    - patterns:
        - pattern: "$REQ.payload"
        - metavariable-regex:
            metavariable: $REQ
            regex: "^(req|request|args|input)$"
    - patterns:
        - pattern-either:
            - pattern-inside: "resolver.define($N, ({ payload: $P, ... }) => { ... })"
            - pattern-inside: "resolver.define($N, async ({ payload: $P, ... }) => { ... })"
        - pattern: "$P"
  pattern-sanitizers:
    - patterns:
        - pattern: "$V"
        - metavariable-regex:
            metavariable: $V
            regex: "(?i)(^|\\.)(maxResults|startAt|limit|offset|pageSize|cursor|nextPageToken|fields|expand)$"
  pattern-sinks:
    - patterns:
        - pattern: "$API.asApp().$M($URL, { ..., body: JSON.stringify({ ..., jql: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "asApp().$M($URL, { ..., body: JSON.stringify({ ..., jql: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "$API.asApp().$M($URL, { ..., body: JSON.stringify({ ..., cql: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "asApp().$M($URL, { ..., body: JSON.stringify({ ..., cql: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "$API.asApp().$M($URL, { ..., body: JSON.stringify({ ..., query: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "asApp().$M($URL, { ..., body: JSON.stringify({ ..., query: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "$API.asApp().$M($URL, { ..., body: JSON.stringify({ ..., expression: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "asApp().$M($URL, { ..., body: JSON.stringify({ ..., expression: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "$API.asApp().$M($URL, { ..., body: JSON.stringify({ ..., searchString: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X
    - patterns:
        - pattern: "asApp().$M($URL, { ..., body: JSON.stringify({ ..., searchString: $X, ... }), ... })"
        - metavariable-regex:
            metavariable: $M
            regex: "^(requestJira|requestConfluence|requestBitbucket)$"
        - focus-metavariable: $X

# ---------------------------------------------------------------------------------------------
# Resolver payload merged into an object (prototype pollution)
# Deep merge or key-by-key copy of the payload (or a field of it) into another object.
# ---------------------------------------------------------------------------------------------
- id: forge-payload-merge-prototype-pollution
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    A client-supplied object is deep-merged or key-copied into an existing object. A payload with
    __proto__ or constructor.prototype keys pollutes Object.prototype for the whole warm instance,
    which can flip authorization flags and corrupt every later invocation on that instance. Copy
    only an allow-list of fields (pick) or validate with a schema that rejects unknown keys.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/prototype-pollution.mdc"
    cwe: ["CWE-1321"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "@forge/resolver payload into object merge"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  mode: taint
  pattern-sources:
    - patterns:
        - pattern: "payload"
        - pattern-not-inside: |
            const payload = $V;
            ...
    - patterns:
        - pattern: "$REQ.payload"
        - metavariable-regex:
            metavariable: $REQ
            regex: "^(req|request|args|input)$"
    - patterns:
        - pattern-either:
            - pattern-inside: "resolver.define($N, ({ payload: $P, ... }) => { ... })"
            - pattern-inside: "resolver.define($N, async ({ payload: $P, ... }) => { ... })"
        - pattern: "$P"
    - patterns:
        - pattern-either:
            - pattern: "JSON.parse($EVENT.body)"
            - pattern: "$EVENT.body"
        - metavariable-regex:
            metavariable: $EVENT
            regex: "^(event|evt|e|req|request|webtriggerEvent)$"
  pattern-sanitizers:
    - pattern: "$S.parse(...)"
    - pattern: "$S.safeParse(...)"
    - pattern: "pick(...)"
    - pattern: "$L.pick(...)"
    - pattern: "$L.omit(..., [\"__proto__\", ...])"
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: "_.merge($T, $P, ...)"
            - pattern: "merge($T, $P, ...)"
            - pattern: "deepmerge($T, $P, ...)"
            - pattern: "$L.mergeWith($T, $P, ...)"
            - pattern: "$L.defaultsDeep($T, $P, ...)"
            - pattern: "$L.merge($T, $P, ...)"
            - pattern: "$L.assign($T, $P, ...)"
            - pattern: "$L.extend($T, $P, ...)"
            - pattern: "Object.assign($T, $P, ...)"
        - pattern-not: "Object.assign({}, ...)"
        - pattern-not: "_.merge({}, ...)"
        - pattern-not: "$L.merge({}, ...)"
        - metavariable-pattern:
            metavariable: $P
            patterns:
              - pattern-not: "{ ... }"
              - pattern-not: "[ ... ]"
        - focus-metavariable: $P
    - patterns:
        - pattern: |
            for (const $K in $P) { ... $T[$K] = $P[$K]; ... }
        - focus-metavariable: $P
    - patterns:
        - pattern: |
            for (let $K in $P) { ... $T[$K] = $P[$K]; ... }
        - focus-metavariable: $P

# ---------------------------------------------------------------------------------------------
# Request headers or options taken from the payload
# Payload fields spread or assigned into the headers or options of a product or remote request.
# ---------------------------------------------------------------------------------------------
- id: forge-request-headers-from-payload
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    Request headers or the whole options object of a privileged request come from the client
    payload. A caller can override Authorization, routing or content headers on a request the app
    makes with its own or the user's credentials. Build headers from constants and copy only named,
    validated values.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/ssrf.mdc"
    cwe: ["CWE-113", "CWE-915"]
    confidence: HIGH
    security-severity: "7.5"
    forge_surface: "@forge/api request options"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  patterns:
    - pattern-either:
        - pattern: "$API.$M($URL, { ..., headers: payload.$F, ... })"
        - pattern: "$API.$M($URL, { ..., headers: $R.payload.$F, ... })"
        - pattern: "$API.$M($URL, { ..., headers: { ..., ...payload.$F, ... }, ... })"
        - pattern: "$API.$M($URL, { ..., headers: { ..., ...$R.payload.$F, ... }, ... })"
        - pattern: "$API.$M($URL, { ..., ...payload.$F, ... })"
        - pattern: "$API.$M($URL, { ..., ...$R.payload.$F, ... })"
        - pattern: "$API.$M($URL, payload.$F)"
        - pattern: "$API.$M($URL, $R.payload.$F)"
        - pattern: "$FN($URL, { ..., headers: payload.$F, ... })"
        - pattern: "$FN($URL, { ..., headers: { ..., ...payload.$F, ... }, ... })"
        - pattern: "$FN($URL, { ..., ...payload.$F, ... })"
    - metavariable-regex:
        metavariable: $M
        regex: "^(requestJira|requestConfluence|requestBitbucket|requestCompass|requestGraph|fetch|invokeRemote)$"

# ---------------------------------------------------------------------------------------------
# Web trigger shared secret compared with a string literal
# A header or query value compared with a literal: a hardcoded secret and a non-constant-time
# comparison.
# ---------------------------------------------------------------------------------------------
- id: forge-webtrigger-literal-shared-secret
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    The web trigger authenticates the request by comparing a header or query parameter with a
    string literal in the source. The secret ships with the app bundle and is identical for every
    installation, so anyone who reads it can call the trigger on any site. Load the secret with
    storage.getSecret() per installation and compare with crypto.timingSafeEqual().
  metadata:
    skill_rule: "assets/security-rules/forge-webtrigger-entrypoints/webtrigger-security.mdc"
    cwe: ["CWE-798", "CWE-287"]
    confidence: HIGH
    security-severity: "8.5"
    forge_surface: "webtrigger authentication"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
  patterns:
    - pattern-either:
        - pattern: "$EVENT.headers[$H][0] !== \"$LIT\""
        - pattern: "$EVENT.headers[$H][0] != \"$LIT\""
        - pattern: "$EVENT.headers[$H][0] === \"$LIT\""
        - pattern: "$EVENT.headers[$H][0] == \"$LIT\""
        - pattern: "$EVENT.headers[$H] !== \"$LIT\""
        - pattern: "$EVENT.headers[$H] === \"$LIT\""
        - pattern: "$EVENT.headers.$H !== \"$LIT\""
        - pattern: "$EVENT.headers.$H === \"$LIT\""
        - pattern: "$EVENT.queryParameters.$K[0] !== \"$LIT\""
        - pattern: "$EVENT.queryParameters.$K[0] != \"$LIT\""
        - pattern: "$EVENT.queryParameters.$K[0] === \"$LIT\""
        - pattern: "$EVENT.queryParameters.$K[0] == \"$LIT\""
        - pattern: "$EVENT.queryParameters.$K !== \"$LIT\""
        - pattern: "$EVENT.queryParameters.$K === \"$LIT\""
        - pattern: "$EVENT.queryParameters[$K][0] !== \"$LIT\""
        - pattern: "$EVENT.queryParameters[$K][0] === \"$LIT\""
        - pattern: "\"$LIT\" !== $EVENT.headers[$H][0]"
        - pattern: "\"$LIT\" === $EVENT.headers[$H][0]"
        - pattern: "\"$LIT\" !== $EVENT.queryParameters.$K[0]"
        - pattern: "\"$LIT\" === $EVENT.queryParameters.$K[0]"
    - metavariable-regex:
        metavariable: $EVENT
        regex: "^(event|evt|ev|e|req|request|webtriggerEvent|webTriggerEvent|trigger)$"
    - metavariable-regex:
        metavariable: $LIT
        regex: "^.{8,}$"

# ---------------------------------------------------------------------------------------------
# Private cross-tenant API
# Calls to __requestAtlassian, which can address another tenant.
# ---------------------------------------------------------------------------------------------
- id: forge-private-cross-tenant-api
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    __requestAtlassian is a private @forge/api entry point that addresses a product site by cloud
    id, which lets the app reach a tenant other than the installing one. It is unsupported and a
    tenant-isolation risk. Use the public asApp()/asUser() product request methods for the
    installing site only.
  metadata:
    skill_rule: "assets/security-rules/forge-tenant-isolation/_index-tenant-isolation.mdc"
    cwe: ["CWE-668"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "@forge/api private API"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
  pattern-either:
    - pattern: "$X.__requestAtlassian(...)"
    - pattern: "__requestAtlassian(...)"

# ---------------------------------------------------------------------------------------------
# Custom UI: product data and context from @forge/bridge reaches an HTML sink
# Sources: requestJira, requestConfluence, requestBitbucket and view.getContext(). Companion to
# forge-bridge-invoke-to-html-sink.
# ---------------------------------------------------------------------------------------------
- id: forge-bridge-product-data-to-html-sink
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    Data obtained through @forge/bridge (requestJira, requestConfluence, requestBitbucket, or
    view.getContext) is written to an HTML sink in Custom UI. Issue, page and context fields are
    written by other users, so this is stored XSS inside the app iframe. Render as text, or
    sanitise with DOMPurify before inserting HTML.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/xss.mdc"
    cwe: ["CWE-79"]
    confidence: HIGH
    security-severity: "7.5"
    forge_surface: "@forge/bridge + Custom UI DOM"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.jsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
  mode: taint
  pattern-sources:
    - pattern: "requestJira(...)"
    - pattern: "requestConfluence(...)"
    - pattern: "requestBitbucket(...)"
    - pattern: "view.getContext()"
    - pattern: "$V.getContext()"
    - pattern: "$R.json()"
  pattern-sanitizers:
    - pattern: "DOMPurify.sanitize(...)"
    - pattern: "$P.sanitize(...)"
    - pattern: "sanitizeHtml(...)"
    - pattern: "escapeHtml(...)"
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: "$D.innerHTML = $Y"
            - pattern: "$D.outerHTML = $Y"
            - pattern: "$D.insertAdjacentHTML($P, $Y)"
            - pattern: "document.write($Y)"
            - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $Y }} />"
            - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $Y }}>...</$EL>"
        - focus-metavariable: $Y

# ---------------------------------------------------------------------------------------------
# Custom UI: product data reaches an HTML sink (promise-callback form)
# Same defect as forge-bridge-product-data-to-html-sink; taint does not cross .then callbacks.
# ---------------------------------------------------------------------------------------------
- id: forge-bridge-product-data-then-html-sink
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    Data obtained through @forge/bridge (requestJira, requestConfluence, requestBitbucket, or
    view.getContext) is written to an HTML sink inside the .then() callback. Issue, page and context
    fields are written by other users, so this is stored XSS inside the app iframe.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/xss.mdc"
    cwe: ["CWE-79"]
    confidence: HIGH
    security-severity: "7.5"
    forge_surface: "@forge/bridge + Custom UI DOM"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
  patterns:
    - pattern-either:
        - pattern: "$SRC.then(($X) => { ... $D.innerHTML = <... $X ...>; ... })"
        - pattern: "$SRC.then(($X) => { $D.innerHTML = <... $X ...> })"
        - pattern: "$SRC.then(($X) => { ... $D.outerHTML = <... $X ...>; ... })"
        - pattern: "$SRC.then(($X) => { ... $D.insertAdjacentHTML($P, <... $X ...>); ... })"
        - pattern: "$SRC.then(($X) => { ... document.write(<... $X ...>); ... })"
    - metavariable-pattern:
        metavariable: $SRC
        pattern-either:
          - pattern: "view.getContext()"
          - pattern: "$V.getContext()"
          - pattern: "requestJira(...)"
          - pattern: "requestConfluence(...)"
          - pattern: "requestBitbucket(...)"
          - pattern: "$Q.then(...)"

# ---------------------------------------------------------------------------------------------
# Credential-named value logged from Custom UI code
# Credentials written to the browser console are visible to anyone with the page open, so this
# covers only UI directories and only credential-named values. Backend logging is covered by
# forge-sensitive-data-console-logging.
# ---------------------------------------------------------------------------------------------
- id: forge-ui-credential-console-logging
  languages: [javascript, typescript]
  severity: WARNING
  message: >
    A credential-named value (token, secret, password, API key) is written to the browser console
    from Custom UI code. Anyone with the page open, a support screenshot or a browser extension can
    read it. Never log credentials; keep secrets server-side and return only the result of using them.
  metadata:
    skill_rule: "assets/security-rules/forge-auditing/_index-auditing.mdc"
    cwe: ["CWE-532", "CWE-200"]
    confidence: MEDIUM
    security-severity: "6.0"
    forge_surface: "Custom UI console"
  paths:
    include:
      - "**/static/**"
      - "**/frontend/**"
      - "**/ui/**"
      - "**/webui/**"
      - "**/public/**"
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/static/js/**"
  patterns:
    - pattern-either:
        - pattern: "console.$METHOD(..., $VAL, ...)"
        - pattern: "console.$METHOD(..., { ..., $K: $VAL, ... }, ...)"
        - pattern: "console.$METHOD(`...${$VAL}...`, ...)"
    - metavariable-regex:
        metavariable: $VAL
        regex: "(?i)^[a-z0-9_$.]*(token|secret|password|passwd|credential|api_?key|private_?key|authorization)[a-z0-9_$]*$"
    - metavariable-regex:
        metavariable: $METHOD
        regex: "^(log|info|debug|warn|error|trace)$"
    - metavariable-pattern:
        metavariable: $VAL
        patterns:
          - pattern-not: "$A.length"
          - pattern-not: "$A.status"

# ---------------------------------------------------------------------------------------------
# Basic auth built from a stored bot credential or app password
# Companion to forge-atlassian-api-token-basic-auth, which already reports Basic auth sent to
# Bitbucket hosts; this rule reports the credential construction wherever the header is sent.
