# ---------------------------------------------------------------------------------------------
# Atlassian API token used for Basic authentication
# The Basic header must be sent to an Atlassian or Bitbucket host or product REST path, be built
# from an email:token pair, or come from a hardcoded API token constant. Basic auth to
# third-party APIs does not fire.
# ---------------------------------------------------------------------------------------------
- id: forge-atlassian-api-token-basic-auth
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    An Atlassian product API is called with Basic authentication built from an account API
    token. The token is a long-lived personal credential that grants everything its owner can
    do and bypasses the app's declared scopes. Use api.asUser() / api.asApp() with manifest
    scopes instead of collecting or embedding API tokens.
  metadata:
    skill_rule: "assets/security-rules/forge-secrets-storage/hardcoded-secrets.mdc"
    cwe: ["CWE-522", "CWE-798"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "Atlassian product REST APIs"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
  pattern-either:
    # Basic header inside a request whose text names an Atlassian host or product REST path
    - patterns:
        - pattern-either:
            - pattern: "$FN($URL, { ..., headers: { ..., Authorization: `Basic ${$AUTH}`, ... }, ... })"
            - pattern: "$FN($URL, { ..., headers: { ..., 'Authorization': `Basic ${$AUTH}`, ... }, ... })"
            - pattern: "$FN($URL, { ..., headers: { ..., \"Authorization\": `Basic ${$AUTH}`, ... }, ... })"
            - pattern: "$O.$FN($URL, { ..., headers: { ..., Authorization: `Basic ${$AUTH}`, ... }, ... })"
            - pattern: "$O.$FN($URL, { ..., headers: { ..., 'Authorization': `Basic ${$AUTH}`, ... }, ... })"
            - pattern: "$O.$FN($URL, { ..., headers: { ..., Authorization: 'Basic ' + $AUTH, ... }, ... })"
        - pattern-regex: "(?i)(atlassian\\.net|api\\.atlassian\\.com|atlassian-dev\\.net|bitbucket\\.org|/rest/api/|/wiki/rest/|/rest/servicedeskapi/|/gateway/api/|/2\\.0/repositories)"
    # the canonical email:token construction
    - patterns:
        - pattern-either:
            - pattern: "Buffer.from(`${$EMAIL}:${$TOKEN}`, ...)"
            - pattern: "Buffer.from(`${$EMAIL}:${$TOKEN}`)"
            - pattern: "Buffer.from($EMAIL + ':' + $TOKEN, ...)"
            - pattern: "Buffer.from($EMAIL + \":\" + $TOKEN, ...)"
            - pattern: "btoa(`${$EMAIL}:${$TOKEN}`)"
        - metavariable-regex:
            metavariable: $TOKEN
            regex: "(?i)(api.?token|atlassian.?token|personal.?token|pat\\b)"
    # hardcoded api token constant
    - patterns:
        - pattern-either:
            - pattern: const $TOKEN = "..."
            - pattern: let $TOKEN = "..."
            - pattern: const $TOKEN = '...'
            - pattern: let $TOKEN = '...'
        - metavariable-regex:
            metavariable: $TOKEN
            regex: "(?i)^(atlassian|jira|confluence|bitbucket)?_?api_?token$|^atlassian_?token$"

# ---------------------------------------------------------------------------------------------
# assumeTrustedRoute() with a user-controlled path (taint)
# Only user-controlled dynamic paths fire; constants and configuration-driven paths do not.
# ---------------------------------------------------------------------------------------------
- id: forge-assume-trusted-route-dynamic-path
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    User-controlled data reaches assumeTrustedRoute(). This API disables the encoding and
    validation that the route tag performs, so path segments, query parameters and JQL/CQL can
    be injected into the product request. Use the route tag with the value as an interpolated
    segment, or validate the value against a strict allowlist first.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/ssrf.mdc"
    cwe: ["CWE-22", "CWE-20"]
    confidence: HIGH
    security-severity: "8.0"
    forge_surface: "@forge/api assumeTrustedRoute"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
  mode: taint
  pattern-sources:
    - patterns:
        - pattern: payload
        - pattern-not-inside: |
            const payload = $V;
            ...
    - patterns:
        - pattern: $REQ.payload
        - metavariable-regex:
            metavariable: $REQ
            regex: "^(req|request|args|input)$"
    - patterns:
        - pattern-either:
            - pattern-inside: "resolver.define($N, ({ payload: $P, ... }) => { ... })"
            - pattern-inside: "resolver.define($N, async ({ payload: $P, ... }) => { ... })"
        - pattern: $P
    - patterns:
        - pattern-either:
            - pattern: $EVENT.body
            - pattern: $EVENT.queryParameters
            - pattern: $EVENT.headers
            - pattern: $EVENT.path
        - metavariable-regex:
            metavariable: $EVENT
            regex: "^(event|evt|e|req|request|webtriggerEvent)$"
  pattern-sanitizers:
    - pattern: encodeURIComponent(...)
    - patterns:
        - pattern: $V
        - metavariable-regex:
            metavariable: $V
            regex: "(?i)(^|\\.)(maxResults|startAt|limit|offset|pageSize|cursor|page)$"
  pattern-sinks:
    - patterns:
        - pattern: assumeTrustedRoute($PATH)
        - focus-metavariable: $PATH

# ---------------------------------------------------------------------------------------------
# Request data reaching raw SQL text (taint)
# Sinks are the query arguments of executeRaw, queryRaw, prepareRaw, prepare and executeDDL.
