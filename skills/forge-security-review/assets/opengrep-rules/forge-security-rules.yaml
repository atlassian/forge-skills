    - pattern: $S != null
    - pattern: $S === undefined
    - pattern: $S !== undefined
    - pattern: typeof $S
    - pattern: $S.slice(...)
    - pattern: $S.substring(...)
    - pattern: $S.substr(...)
    - pattern: $S.startsWith(...)
    - pattern: $S.endsWith(...)
    - pattern: $S.includes(...)
    - pattern: $S.trim().length
    - pattern: crypto.createHmac(...)
    - pattern: jwt.sign(...)
    - pattern: $H.digest(...)
  pattern-sinks:
