      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
  pattern-either:
    - patterns:
        - pattern-either:
            - pattern: $JWT.verify($TOKEN, "...", ...)
            - pattern: $JWT.verify($TOKEN, '...', ...)
            - pattern: $JWT.sign($CLAIMS, "...", ...)
            - pattern: $JWT.sign($CLAIMS, '...', ...)
        - metavariable-regex:
            metavariable: $JWT
            regex: "(?i)^(jwt|jsonwebtoken|jose|jws|njwt|token|jwtlib|JWT)$"
    - pattern: jwtVerify($TOKEN, new TextEncoder().encode("..."), ...)
    - pattern: jwtVerify($TOKEN, new TextEncoder().encode('...'), ...)

# ---------------------------------------------------------------------------------------------
# Environment variable rendered into UI
# Covers JSX attribute and nested-expression forms; obviously non-secret variable names are
