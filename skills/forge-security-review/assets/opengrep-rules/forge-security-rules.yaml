      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
  patterns:
    - pattern-either:
        - pattern: $CTX.accountId == "$ID"
        - pattern: $CTX.accountId === "$ID"
        - pattern: $CTX.accountId != "$ID"
        - pattern: $CTX.accountId !== "$ID"
        - pattern: $CTX.accountId == '$ID'
        - pattern: $CTX.accountId === '$ID'
        - pattern: $CTX.accountId != '$ID'
        - pattern: $CTX.accountId !== '$ID'
        - pattern: '"$ID" == $CTX.accountId'
        - pattern: '"$ID" === $CTX.accountId'
        - pattern: "'$ID' == $CTX.accountId"
        - pattern: "'$ID' === $CTX.accountId"
        - pattern: '["$ID", ...].includes($CTX.accountId)'
        - pattern: "['$ID', ...].includes($CTX.accountId)"
    - metavariable-regex:
        metavariable: $ID
        regex: "^(?:[0-9a-f]{24}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9]{6}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"

# ---------------------------------------------------------------------------------------------
# JWT verified or signed with a string-literal secret
# A literal JWT secret is wrong in any Forge file. Similar to the upstream hardcoded-jwt-secret
# rule; included so this file is self-contained.
# ---------------------------------------------------------------------------------------------
- id: forge-jwt-literal-secret
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    A JWT is verified or signed with a string literal as the secret. The literal ships with
    the app source, so anyone who reads the repository or bundle can mint valid tokens and
    pass the web trigger's authentication. Load the secret with storage.getSecret() or a Forge
    encrypted environment variable.
  metadata:
    skill_rule: "assets/security-rules/forge-secrets-storage/hardcoded-secrets.mdc"
    cwe: ["CWE-798", "CWE-287"]
    confidence: HIGH
