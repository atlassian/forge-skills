# ---------------------------------------------------------------------------------------------
# Console logging of whole request objects or credentials
# Only whole-object dumps of request/event/context/payload/headers (bare identifier or
# JSON.stringify of it) and credential-named values fire; logging individual fields such as
# response.status does not.
# ---------------------------------------------------------------------------------------------
- id: forge-sensitive-data-console-logging
  languages: [javascript, typescript]
  severity: WARNING
  message: >
    A console call writes a whole request, event, context, payload or headers object, or a
    credential-named value. Forge logs are retained and visible to the app developer, so this
    exposes end-user data or secrets outside the product. Log only the identifiers needed for
    operations and never log tokens or raw payloads.
  metadata:
    skill_rule: "assets/security-rules/forge-auditing/_index-auditing.mdc"
    cwe: ["CWE-532"]
    confidence: MEDIUM
    security-severity: "5.0"
    forge_surface: "Forge runtime logging"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/static/**"
      - "**/frontend/**"
      - "**/ui/**"
      - "**/webui/**"
      - "**/public/**"
      - "**/chrome-extension/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
  patterns:
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern: console.$METHOD(..., $OBJ, ...)
                - pattern: console.$METHOD(..., JSON.stringify($OBJ, ...), ...)
                - pattern: "console.$METHOD(..., { ..., $K: $OBJ, ... }, ...)"
            - metavariable-regex:
                metavariable: $OBJ
                regex: "^(req|request|event|evt|context|payload|headers|body|credentials)$|^(req|request|event|evt)\\.(payload|context|body|headers)$|^(context|payload)\\.(context|payload)$"
        - patterns:
            - pattern-either:
                - pattern: console.$METHOD(..., $VAL, ...)
                - pattern: "console.$METHOD(..., { ..., $K: $VAL, ... }, ...)"
                - pattern: console.$METHOD(`...${$VAL}...`, ...)
            - metavariable-regex:
                metavariable: $VAL
                regex: "(?i)^[a-z0-9_$.]*(token|secret|password|passwd|credential|api_?key|private_?key|authorization)[a-z0-9_$]*$"
            - metavariable-pattern:
                metavariable: $VAL
                patterns:
                  - pattern-not: $A.status
                  - pattern-not: $A.length
                  - pattern-not: $A.ok
    - metavariable-regex:
        metavariable: $METHOD
        regex: "^(log|info|debug|warn|error|trace)$"

# ---------------------------------------------------------------------------------------------
