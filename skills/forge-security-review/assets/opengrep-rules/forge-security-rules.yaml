    - pattern-regex: "(?m)^\\s*access:\\s*\\[[^\\]]*anonymous"
    - pattern-regex: "(?ms)^\\s*access:\\s*\\n\\s*-\\s*['\"]?anonymous"
    - pattern-regex: "\"access\"\\s*:\\s*(\"anonymous\"|\\[[^\\]]*\"anonymous\")"

# ---------------------------------------------------------------------------------------------
# HTML template with interpolated data (generic, non-webtrigger)
# Templates that interpolate data are flagged unless the interpolation passes through an
# escaping helper. dangerouslySetInnerHTML is left to the invoke taint rules and to the
# upstream react-dangerouslysetinnerhtml rule.
# ---------------------------------------------------------------------------------------------
- id: forge-unsafe-html-rendering
  languages: [javascript, typescript]
  severity: WARNING
  message: >
    An HTML string is built with interpolated data. If any value comes from users or product
    content this is XSS wherever the string is rendered (Custom UI, web trigger response,
    Confluence storage format). HTML-encode each value for its context or use a templating
    layer that escapes by default.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/xss.mdc"
    cwe: ["CWE-79"]
    confidence: MEDIUM
    security-severity: "5.5"
    forge_surface: "generated HTML"
    upstream_overlap: "opengrep-rules typescript.react.security.audit.react-dangerouslysetinnerhtml (for the JSX form)"
  paths:
