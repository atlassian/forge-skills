# ---------------------------------------------------------------------------------------------
# Token-shaped value written to plain storage
# The value name must end in a credential word (word boundary), so names such as tokenCount or
# oauthState do not match.
# ---------------------------------------------------------------------------------------------
- id: forge-token-in-plain-storage
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    A credential (token, secret, password, API key) is written with storage.set(). Plain
    storage is not encrypted at rest for secrets and is readable by every resolver. Use
    storage.setSecret() / kvs.setSecret() for credentials.
  metadata:
    skill_rule: "assets/security-rules/forge-secrets-storage/_index-secrets-storage.mdc"
    cwe: ["CWE-312"]
    confidence: HIGH
    security-severity: "7.5"
    forge_surface: "@forge/api storage.set vs setSecret"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
  patterns:
    - pattern-either:
        - pattern: storage.set($KEY, $VAL)
        - pattern: kvs.set($KEY, $VAL)
        - pattern: storage.entity($E).set($KEY, $VAL)
        - pattern: kvs.entity($E).set($KEY, $VAL)
    - metavariable-regex:
        metavariable: $VAL
        regex: "(?i)(^|[^a-z0-9_$])[a-z0-9_$.]*(token|secret|password|passwd|credentials?|api_?key|private_?key|client_?secret)\\b"

# ---------------------------------------------------------------------------------------------
# Custom UI: resolver result reaches an HTML sink (await form, taint)
# textContent and innerText are safe sinks and are not reported; only HTML-interpreting sinks
# are.
# ---------------------------------------------------------------------------------------------
- id: forge-bridge-invoke-to-html-sink
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    Data returned by a @forge/bridge invoke() call is written to an HTML sink (innerHTML,
    outerHTML, insertAdjacentHTML, document.write, dangerouslySetInnerHTML). Resolver output
    often contains product data written by other users, so this is stored XSS inside the app
    iframe, from where the attacker can call invoke() as the victim. Render as text, or
    sanitise with DOMPurify before inserting HTML.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/xss.mdc"
    cwe: ["CWE-79"]
    confidence: HIGH
    security-severity: "7.5"
    forge_surface: "@forge/bridge invoke + Custom UI DOM"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.jsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
  mode: taint
  pattern-sources:
    - pattern: invoke(...)
    - pattern: $B.invoke(...)
  pattern-sanitizers:
    - pattern: DOMPurify.sanitize(...)
    - pattern: $P.sanitize(...)
    - pattern: sanitizeHtml(...)
    - pattern: escapeHtml(...)
    - pattern: escape(...)
    - pattern: encodeURIComponent(...)
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: $D.innerHTML = $Y
            - pattern: $D.outerHTML = $Y
            - pattern: $D.insertAdjacentHTML($P, $Y)
            - pattern: document.write($Y)
            - pattern: document.writeln($Y)
            - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $Y }} />"
            - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $Y }}>...</$EL>"
        - focus-metavariable: $Y

# ---------------------------------------------------------------------------------------------
# Custom UI: resolver result reaches an HTML sink (promise-callback form)
# Same defect as forge-bridge-invoke-to-html-sink; taint does not cross .then callbacks, so the
# callback form needs its own rule.
# ---------------------------------------------------------------------------------------------
- id: forge-bridge-invoke-then-html-sink
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    Data returned by a @forge/bridge invoke() call is written to an HTML sink inside the
    .then() callback. This is stored XSS inside the app iframe if the resolver returns product
    data written by other users. Render as text, or sanitise with DOMPurify first.
  metadata:
    skill_rule: "assets/security-rules/forge-injection/xss.mdc"
    cwe: ["CWE-79"]
    confidence: HIGH
    security-severity: "7.5"
    forge_surface: "@forge/bridge invoke + Custom UI DOM"
  paths:
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/__tests__/**"
      - "**/*.test.js"
      - "**/*.test.jsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
  pattern-either:
    - pattern: invoke(...).then(($X) => { $D.innerHTML = <... $X ...> })
    - pattern: invoke(...).then(($X) => { ... $D.innerHTML = <... $X ...>; ... })
    - pattern: invoke(...).then(($X) => { $D.outerHTML = <... $X ...> })
    - pattern: invoke(...).then(($X) => { ... $D.outerHTML = <... $X ...>; ... })
    - pattern: invoke(...).then(($X) => { $D.insertAdjacentHTML($P, <... $X ...>) })
    - pattern: invoke(...).then(($X) => { ... $D.insertAdjacentHTML($P, <... $X ...>); ... })
    - pattern: invoke(...).then(($X) => { document.write(<... $X ...>) })
    - pattern: invoke(...).then(($X) => { ... document.write(<... $X ...>); ... })
    - pattern: invoke(...).then(function($X) { $D.innerHTML = <... $X ...> })
    - pattern: invoke(...).then(function($X) { ... $D.innerHTML = <... $X ...>; ... })

# ---------------------------------------------------------------------------------------------
# Authorization decision on a hardcoded account identifier
# Covers equality, negated comparisons and array membership.
# ---------------------------------------------------------------------------------------------
- id: forge-hardcoded-account-gate
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    An authorization decision compares the caller's accountId with a hardcoded Atlassian
    account identifier. Anyone who learns the identifier knows exactly whose session to target,
    the gate cannot be audited or revoked without a code change, and it breaks on every new
    admin. Check a product permission or group membership through the product API instead.
  metadata:
    skill_rule: "assets/security-rules/forge-authn-authz/missing-resolver-authz.mdc"
    cwe: ["CWE-798", "CWE-863"]
