- id: forge-manifest-anonymous-access-module
  languages: [generic]
  severity: WARNING
  message: >
    This module is reachable by anonymous (unauthenticated) users. Every resolver function it
    can invoke runs for callers with no accountId. Confirm those resolvers perform no writes,
    no asApp() reads of restricted data, and nothing billable, or remove anonymous access.
