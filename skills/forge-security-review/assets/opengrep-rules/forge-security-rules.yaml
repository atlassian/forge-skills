        - pattern: <$EL ...>{<... process.env.$X ...>}</$EL>
        - pattern: <$EL $A={<... process.env.$X ...>} ...>...</$EL>
        - pattern: <$EL $A={<... process.env.$X ...>} ... />
    - metavariable-regex:
