name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        working-directory: skills/forge-app-builder
        run: python -m unittest discover -s tests -v

  security-review:
    name: Security review rule packs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Runs the rule-pack structure checks, the wrapper script checks and the fixture scans.
      # The fixture scans download the pinned OpenGrep release once and verify its checksum.
      - name: Run tests
        working-directory: skills/forge-security-review
        run: python -m unittest discover -s tests -v
